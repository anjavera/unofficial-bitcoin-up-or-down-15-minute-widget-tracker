[project]
name = "btc15-widget"
version = "0.1.0"
description = "Unofficial live widget and recorder for Polymarket US BTC Up or Down 15-minute markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polymarket-us>=0.1.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
btc15-record = "btc15_widget.recorder:main"
btc15-summarize = "btc15_widget.summarize:main"
pm = "btc15_widget.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
